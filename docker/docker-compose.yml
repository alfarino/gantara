
services:
  # 1. Container Database PostgreSQL
  gantara-db:
    image: postgres:15-alpine
    container_name: gantara-db-container
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gantara_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gantara_password_super_secure_99}
      POSTGRES_DB: ${POSTGRES_DB:-gantara_prod}
    volumes:
      - gantara-db-data:/var/lib/postgresql/data
    networks:
      - gantara-network
    # Health check: tunggu PostgreSQL siap menerima koneksi
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gantara_user} -d ${POSTGRES_DB:-gantara_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # 2. Container Aplikasi Web Next.js
  gantara-app:
    build:
      context: ../
      dockerfile: Dockerfile
    container_name: gantara-app-container
    restart: always
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-gantara_user}:${POSTGRES_PASSWORD:-gantara_password_super_secure_99}@gantara-db:5432/${POSTGRES_DB:-gantara_prod}?schema=public
      - DIRECT_URL=postgresql://${POSTGRES_USER:-gantara_user}:${POSTGRES_PASSWORD:-gantara_password_super_secure_99}@gantara-db:5432/${POSTGRES_DB:-gantara_prod}?schema=public
      - JWT_SECRET=${JWT_SECRET:-changeme-please-use-a-long-random-secret}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-24h}
      - JWT_REMEMBER_EXPIRES_IN=${JWT_REMEMBER_EXPIRES_IN:-30d}
      - STORAGE_PROVIDER=local
      - STORAGE_LOCAL_PATH=/app/public/uploads
    depends_on:
      gantara-db:
        condition: service_healthy   # Tunggu DB benar-benar siap
    volumes:
      - gantara-uploads:/app/public/uploads
    networks:
      - gantara-network

  # 3. Reverse Proxy Nginx (akses via port 80)
  gantara-nginx:
    image: nginx:alpine
    container_name: gantara-nginx-container
    restart: always
    ports:
      - "8443:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gantara-app
    networks:
      - gantara-network

volumes:
  gantara-db-data:
    driver: local
  gantara-uploads:
    driver: local

networks:
  gantara-network:
    driver: bridge
